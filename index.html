<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column, sticky brand bar, fixed bottom tab bar, bottom-sheet forms */
:root{
  --bg:#f5f2fc; --surface:#ffffff; --surface-2:#eee8fa; --ink:#231a38; --muted:#695e84;
  --line:#ddd3f1; --accent:#7446d6; --accent-ink:#ffffff; --accent-soft:#e7ddfb;
  --hard:#25865b; --hard-soft:#dcf2e7; --easy:#b26d0c; --easy-soft:#fbebd2; --rest:#bd3c4f; --rest-soft:#f9dde1;
  --info:#5b6b8f; --shadow:0 1px 2px rgba(60,30,120,.06),0 6px 20px rgba(60,30,120,.07);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14101d; --surface:#1d172b; --surface-2:#271f3a; --ink:#ede7fb; --muted:#a79cc6;
  --line:#352b4f; --accent:#ad8cff; --accent-ink:#1a1230; --accent-soft:#30255a;
  --hard:#55c992; --hard-soft:#173a2b; --easy:#f0b04f; --easy-soft:#3d2c12; --rest:#f07a8b; --rest-soft:#43202a;
  --info:#9fb0d6; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14101d; --surface:#1d172b; --surface-2:#271f3a; --ink:#ede7fb; --muted:#a79cc6;
  --line:#352b4f; --accent:#ad8cff; --accent-ink:#1a1230; --accent-soft:#30255a;
  --hard:#55c992; --hard-soft:#173a2b; --easy:#f0b04f; --easy-soft:#3d2c12; --rest:#f07a8b; --rest-soft:#43202a;
  --info:#9fb0d6; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.top .brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.top .date{margin-left:auto;color:var(--muted);font-size:.85rem}
.logo{width:34px;height:34px;flex:none}

/* views */
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.banner{font-size:.85rem;border-radius:12px;padding:10px 12px;background:var(--accent-soft);color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.banner b{font-weight:700}

/* verdict */
.verdict{border-radius:20px;padding:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center}
.verdict .call{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.05;letter-spacing:-.02em}
.verdict .sub{font-size:.9rem;color:var(--muted);margin-top:6px}
.verdict[data-v="HARD"]{background:linear-gradient(160deg,var(--hard-soft),var(--surface) 70%)} .verdict[data-v="HARD"] .call{color:var(--hard)}
.verdict[data-v="EASY"]{background:linear-gradient(160deg,var(--easy-soft),var(--surface) 70%)} .verdict[data-v="EASY"] .call{color:var(--easy)}
.verdict[data-v="REST"]{background:linear-gradient(160deg,var(--rest-soft),var(--surface) 70%)} .verdict[data-v="REST"] .call{color:var(--rest)}
.gauge{width:104px;height:104px;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .val b{font-family:var(--f-display);font-size:1.7rem;line-height:1}
.gauge .val span{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.conf{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--ink)}
.pill.HARD{background:var(--hard-soft);color:var(--hard)} .pill.EASY{background:var(--easy-soft);color:var(--easy)} .pill.REST{background:var(--rest-soft);color:var(--rest)}

/* reasons */
.reasons{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.reasons li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:.92rem;align-items:start}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;justify-self:center;background:var(--info)}
.dot.rest{background:var(--rest)} .dot.easy{background:var(--easy)} .dot.ok{background:var(--hard)} .dot.warn{background:var(--easy);border-radius:2px;transform:rotate(45deg)} .dot.info{background:transparent;border:2px solid var(--info)}
.reasons li.info{color:var(--muted)}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:1.05rem}
.stat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}

/* session */
.session{display:flex;flex-direction:column;gap:10px}
.session .t{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--rest);border-color:var(--rest)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;border:0;width:100%;cursor:pointer;text-align:left;min-height:56px}
.cta b{font-family:var(--f-display);font-size:1rem}
.cta span{font-size:.85rem;opacity:.85}

.note{font-size:.8rem;color:var(--muted);line-height:1.45}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px;min-height:52px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"] .ic{background:var(--accent-soft)}
.tabs .ic{display:flex;padding:3px 16px;border-radius:999px}

/* charts */
.chart-box{position:relative;height:220px;margin-top:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h2{flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .dow{font-size:.68rem;text-align:center;color:var(--muted);font-weight:700;letter-spacing:.05em}
.day{aspect-ratio:1/1.12;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;min-width:0;position:relative;overflow:hidden}
.day.out{opacity:.35}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 4px}
.day .dn{font-size:.75rem;font-weight:700;align-self:flex-start}
.day .vb{position:absolute;left:0;right:0;bottom:0;height:4px}
.day .vb.HARD{background:var(--hard)} .day .vb.EASY{background:var(--easy)} .day .vb.REST{background:var(--rest)}
.day .wk{display:flex;flex-wrap:wrap;gap:2px}
.day .wk em{font-style:normal;font-size:.58rem;font-weight:700;line-height:1;padding:2px 3px;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:10px}
.cal-legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:2px}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kv b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.wlist{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.wlist li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.wlist .wt{flex:1;min-width:0}
.wlist .wt b{display:block;overflow-wrap:anywhere}
.wlist .wt span{font-size:.8rem;color:var(--muted)}
.tag{font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=number],input[type=text],input[type=date],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
textarea.code{font-family:var(--f-mono);font-size:.78rem;min-height:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.slider{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center}
.slider span{font-size:.85rem;font-weight:700}
.slider output{font-family:var(--f-mono);text-align:right;font-weight:500}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.toggles{display:flex;flex-direction:column;gap:6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:48px;cursor:pointer}
.tg input{width:22px;height:22px;accent-color:var(--accent)}
.set-group{display:flex;flex-direction:column;gap:10px}
.set-group h3{margin-top:4px}
details.card summary{cursor:pointer;font-family:var(--f-display);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card[open] summary{margin-bottom:12px}
.status{font-size:.85rem;border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.status.err{background:var(--rest-soft);color:var(--rest)}
.status.ok{background:var(--hard-soft);color:var(--hard)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(20,10,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head h2{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;max-width:calc(100% - 32px)}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M20 2 36 11v18L20 38 4 29V11Z" fill="var(--accent)"/>
      <path d="M12 26c3-9 8-13 15-14-3 3-4 6-4 9 2-1 4-1 6 0-4 2-8 4-17 5Z" fill="var(--accent-ink)"/>
    </svg>
    <span class="brand">Dragon Training</span>
    <span class="date" id="hdr-date"></span>
  </header>

  <main>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-trends" hidden></section>
    <section class="view" id="v-history" hidden></section>
    <section class="view" id="v-prefs" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Today</button>
  <button data-tab="trends"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 7-9"/><path d="M3 21h18"/></svg></span>Trends</button>
  <button data-tab="history"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>History</button>
  <button data-tab="prefs"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></span>Settings</button>
</nav>

<div class="sheet-wrap" id="sheet" hidden><div class="sheet" id="sheet-body" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
"use strict";
const KEY = 'dean-rot-v1', PLANNER_KEY = 'dean-planner-v2';
const TYPES = ['cycling','strength','pool','walking','hiking','kayaking','other'];
const TYPE_LABEL = {cycling:'Cycling',strength:'Strength',pool:'Pool',walking:'Walking',hiking:'Hiking',kayaking:'Kayaking',other:'Other'};
const TYPE_ABBR = {cycling:'Bike',strength:'Str',pool:'Pool',walking:'Walk',hiking:'Hike',kayaking:'Kyk',other:'Oth'};
const DEFAULT_RPE = {cycling:5,strength:6,pool:5,walking:3,hiking:4,kayaking:4,other:4};
const DEFAULTS = {
  hrvWindow:60, hrvMinDays:14, hrvBandSD:0.75, rhrWindow:30,
  rhrEasy:3, rhrRest:5, sleepRest:5, sleepEasy:6.5, sleepScoreEasy:60,
  sorenessEasy:4, formVeryNeg:-25, formModNeg:-10, poorSubjCount:2,
  spikePct:30, srpeFactor:0.18, ctlDays:42, atlDays:7, units:'mi',
  hrvMeanOverride:'', hrvSdOverride:'', rhrMeanOverride:''
};
const SETTING_DEFS = [
  ['Decision thresholds',[
    ['sleepRest','Rest if sleep under (h)',0.25],['sleepEasy','Easy if sleep under (h)',0.25],
    ['sleepScoreEasy','Easy if sleep score under',1],['sorenessEasy','Easy if soreness at least (1–5)',1],
    ['rhrEasy','Easy if resting HR up by (bpm)',1],['rhrRest','Rest if HRV low and RHR up by (bpm)',1],
    ['formModNeg','Easy if form at or below',1],['formVeryNeg','Rest if form at or below (with poor check-in)',1],
    ['poorSubjCount','Poor check-in scores that count',1],['spikePct','Flag weekly load jump over (%)',1]
  ]],
  ['Baselines',[
    ['hrvWindow','HRV baseline window (days)',1],['hrvMinDays','HRV readings needed for baseline',1],
    ['hrvBandSD','HRV normal range (± SD)',0.05],['rhrWindow','Resting HR baseline window (days)',1],
    ['hrvMeanOverride','HRV mean override (blank = auto)',1],['hrvSdOverride','HRV SD override (blank = auto)',0.1],
    ['rhrMeanOverride','Resting HR override (blank = auto)',1]
  ]],
  ['Training load',[
    ['ctlDays','Fitness time constant (days)',1],['atlDays','Fatigue time constant (days)',1],
    ['srpeFactor','Session-RPE → TSS scale',0.01]
  ]]
];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ds = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDs = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (s,n) => { const d = parseDs(s); d.setDate(d.getDate()+n); return ds(d); };
const todayStr = () => ds(new Date());
const num = v => (v===''||v==null||v===false) ? null : (isFinite(+v) ? +v : null);
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const sdev = a => { if(a.length<2) return null; const m=avg(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1)); };
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v,d=0) => v==null||!isFinite(v) ? '—' : (+v).toFixed(d);
const signed = (v,d=0) => v==null||!isFinite(v) ? '—' : (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);
const niceDate = s => parseDs(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const uid = () => Math.random().toString(36).slice(2,10);

function mapType(raw){
  const s = String(raw||'').toLowerCase();
  if(/ride|cycl|bike|spin|zwift|wahoo/.test(s)) return 'cycling';
  if(/weight|strength|gym|machine|lift|circuit|rack|body ?weight|crossfit/.test(s)) return 'strength';
  if(/swim|pool|aqua|water ?walk/.test(s)) return 'pool';
  if(/hike|hiking/.test(s)) return 'hiking';
  if(/walk/.test(s)) return 'walking';
  if(/kayak|canoe|paddl|row/.test(s)) return 'kayaking';
  return 'other';
}

/* ---------- storage ---------- */
let storageOK = true;
function blank(){ return {version:1, checkins:{}, workouts:[], settings:Object.assign({},DEFAULTS), icu:{athleteId:'',apiKey:''}, seeded:false}; }
function loadState(){
  let s = null;
  try { const raw = localStorage.getItem(KEY); if(raw) s = JSON.parse(raw); } catch(e){ storageOK = false; }

}
function normalize(s){

function save(){

let S = loadState();

/* ---------- sample data (30 days) ---------- */
function rng(seed){ return () => { seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }; }
function seedSample(s){
  const r = rng(7), g = () => { const u = r()||1e-9, v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const t = todayStr();
  for(let i=29;i>=0;i--){
    const d = addDays(t,-i), k = 29-i;
    let dip = 0; if(k>=18 && k<=22) dip = 7; if(k>=25) dip = 8;
    const hrv = Math.round(57 - dip + g()*3);
    const rhr = Math.round(53 + dip*0.45 + g()*1.1);
    const sleepH = clamp(Math.round((7.25 + g()*0.55)*4)/4, 5.5, 8.75);
    const sore = clamp(Math.round(2 + dip/5 + g()*0.6),1,5);
    s.checkins[d] = {hrv, rhr, sleepH, sleepScore: clamp(Math.round(58 + (sleepH-5.5)*11 + g()*4),40,97),
      energy: clamp(Math.round(4 - dip/6 + g()*0.5),1,5), soreness: sore, stress: clamp(Math.round(2.5+g()*0.7),1,5),
      motivation: clamp(Math.round(4 + g()*0.6),1,5), sick:false, injury:false, poorNutrition: r()<0.08,
      note:'', subjective:true, sample:true};
    const dow = parseDs(d).getDay(), block = (k>=12 && k<=21) ? 1.25 : 1;
    const add = (type,name,dur,rpe,extra) => s.workouts.push(Object.assign({id:'smp-'+d+'-'+type, date:d, type, name, durationMin:Math.round(dur), rpe, tss:null, distance:null, avgHr:null, source:'manual', sample:true}, extra||{}));
    if(i===0) continue; // today not done yet
    if(dow===1) add('strength','John A. Logan strength circuit',55,7);
    if(dow===2) add('cycling','Threshold intervals',70*block,7,{tss:Math.round(85*block), distance:Math.round(19*block*10)/10, avgHr:142});
    if(dow===3) (k%2 ? add('pool','Pool workout',40,4) : add('walking','Neighborhood walk',45,3,{distance:2.4}));
    if(dow===4) add('cycling','Tempo ride',75*block,6,{tss:Math.round(70*block), distance:Math.round(21*block*10)/10, avgHr:136});
    if(dow===5 && k%2) add('strength','Rack and free-weight session',50,6);
    if(dow===6) add('cycling','Long ride',150*block,5,{tss:Math.round(125*block), distance:Math.round(40*block*10)/10, avgHr:128});
    if(dow===0) (k%2 ? add('hiking','Giant City trail hike',95,4,{distance:4.6}) : add('kayaking','Lake paddle',70,4,{distance:5}));
  }
  // today's check-in, deterministic
  s.checkins[t] = {hrv:47, rhr:57, sleepH:6.75, sleepScore:71, energy:3, soreness:3, stress:3, motivation:4,
    sick:false, injury:false, poorNutrition:false, note:'Legs a bit heavy after the weekend', subjective:true, sample:true};
}
const hasSample = () => S.workouts.some(w=>w.sample) || Object.values(S.checkins).some(c=>c.sample);

/* ---------- Workout Planner bridge (read-only) ---------- */
let plannerCache = null;
function plannerWorkouts(){
  if(plannerCache) return plannerCache;
  const out = [];
  try {
    const raw = localStorage.getItem(PLANNER_KEY);
    if(raw){
      const seen = new Set();
      const walk = (node, depth) => {
        if(depth>6 || !node || typeof node!=='object') return;
        if(Array.isArray(node)){ node.forEach(n => { tryItem(n); walk(n, depth+1); }); return; }
        Object.values(node).forEach(v => walk(v, depth+1));
      };
      const tryItem = it => {
        if(!it || typeof it!=='object' || Array.isArray(it)) return;
        const dRaw = it.date || it.day || it.scheduledDate || it.completedAt || it.dateCompleted || it.completedDate;
        const done = it.completed===true || it.done===true || it.isComplete===true || /complete|done|finished/i.test(String(it.status||'')) || !!it.completedAt;
        if(!dRaw || !done) return;
        let date = String(dRaw).slice(0,10);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ const dt = new Date(dRaw); if(isNaN(dt)) return; date = ds(dt); }
        const name = it.name || it.title || it.template || it.templateName || 'Planner workout';
        const dur = num(it.durationMin) ?? num(it.duration) ?? num(it.minutes) ?? num(it.mins) ?? num(it.time) ?? 45;
        const id = 'pl-' + (it.id || (date + '-' + name));
        if(seen.has(id)) return; seen.add(id);
        out.push({id, date, type: mapType(it.category || it.type || it.activity || it.kind || name), name: String(name),
          durationMin: dur, rpe: num(it.rpe), tss: num(it.tss), distance: num(it.distance), avgHr: num(it.avgHr), source:'planner'});
      };
      walk(JSON.parse(raw), 0);
    }
  } catch(e){ /* planner data unreadable: ignore */ }
  plannerCache = out;
  return out;
}
function allWorkouts(){
  const ids = new Set(S.workouts.map(w=>w.id));
  return S.workouts.concat(plannerWorkouts().filter(w=>!ids.has(w.id)));
}

/* ---------- training load ---------- */
function workoutLoad(w){
  const t = num(w.tss);
  if(t!=null) return t;
  const rpe = num(w.rpe) || DEFAULT_RPE[w.type] || 4;
  return (num(w.durationMin)||0) * rpe * S.settings.srpeFactor;
}
let SER = null;
function buildSeries(){
  const st = S.settings, t = todayStr();
  const loadByDay = {};
  allWorkouts().forEach(w => { if(w.date) loadByDay[w.date] = (loadByDay[w.date]||0) + workoutLoad(w); });
  const dates = Object.keys(loadByDay).concat(Object.keys(S.checkins)).filter(d=>d<=t).sort();
  const firstData = dates.length ? dates[0] : t;
  const start = firstData < addDays(t,-70) ? firstData : addDays(t,-70);
  let init = 0; for(let i=0;i<14;i++) init += loadByDay[addDays(firstData,i)]||0; init /= 14;
  let ctl = init, atl = init; const rows = {};
  for(let d=start; d<=t; d=addDays(d,1)){
    if(d<firstData){ rows[d] = null; continue; }
    const L = loadByDay[d]||0;
    ctl += (L-ctl)/Math.max(1,st.ctlDays); atl += (L-atl)/Math.max(1,st.atlDays);
    rows[d] = {load:L, ctl, atl, form:ctl-atl};
  }
  SER = {rows, loadByDay, firstData};
  return SER;
}

/* ---------- decision engine ---------- */
function hrvBaseline(D){
  const st = S.settings, vals = [];
  for(let i=1;i<=st.hrvWindow;i++){ const v = num(S.checkins[addDays(D,-i)]?.hrv); if(v!=null) vals.push(v); }
  let mean = avg(vals), sd = sdev(vals); const n = vals.length;
  const mo = num(st.hrvMeanOverride), so = num(st.hrvSdOverride);
  if(mo!=null) mean = mo; if(so!=null) sd = so;
  const ok = (mo!=null && (so!=null || sd!=null)) || (n>=st.hrvMinDays && mean!=null && sd!=null);
  return {mean, sd: sd==null?null:Math.max(sd,1), n, ok};
}
function hrvRolling(D){ const v=[]; for(let i=0;i<7;i++){ const x = num(S.checkins[addDays(D,-i)]?.hrv); if(x!=null) v.push(x); } return {mean:avg(v), n:v.length}; }
function rhrBaseline(D){
  const st = S.settings, vals = [];
  for(let i=1;i<=st.rhrWindow;i++){ const v = num(S.checkins[addDays(D,-i)]?.rhr); if(v!=null) vals.push(v); }
  const mo = num(st.rhrMeanOverride);
  return {mean: mo!=null ? mo : avg(vals), n: vals.length, ok: mo!=null || vals.length>=7};
}
function loadSpike(D){
  const ser = SER, sum = (a,b) => { let s=0; for(let i=a;i<=b;i++) s += ser.loadByDay[addDays(D,-i)]||0; return s; };
  const last7 = sum(1,7);
  const firstIdx = Math.round((parseDs(D)-parseDs(ser.firstData))/864e5);
  const priorDays = clamp(firstIdx-7, 0, 28);
  if(priorDays < 14) return {ok:false, last7};
  const priorAvg = sum(8, 7+priorDays) / (priorDays/7);
  if(priorAvg<=0) return {ok:false, last7};
  const pct = (last7/priorAvg - 1)*100;
  return {ok:true, last7, priorAvg, pct, spike: pct > S.settings.spikePct};
}

function evaluate(D){
  const st = S.settings, ci = S.checkins[D] || null, R = [];
  const restF = [], easyF = [];
  let pen = 0; const have = {hrv:false, rhr:false, sleep:false, subj:false, load:false}; const missing = [];

  // HRV
  const hb = hrvBaseline(D), hr = hrvRolling(D);
  let hrvLow = false;
  if(hr.n && hb.ok){
    have.hrv = true;
    const lo = hb.mean - st.hrvBandSD*hb.sd, hi = hb.mean + st.hrvBandSD*hb.sd, z = (hr.mean-hb.mean)/hb.sd;
    const band = `${fmt(lo)}–${fmt(hi)} ms`, few = hr.n<4 ? ` (only ${hr.n} reading${hr.n>1?'s':''} this week)` : '';
    if(hr.mean < lo){ hrvLow = true; R.push({lv:'easy', key:'hrv', t:`HRV 7-day average ${fmt(hr.mean)} ms is below your normal range of ${band}${few}.`}); }
    else R.push({lv:'ok', t:`HRV 7-day average ${fmt(hr.mean)} ms is inside or above your normal range of ${band}${few}.`});
    pen += Math.min(30, Math.max(0,-z)*12);
  } else if(hr.n){ R.push({lv:'info', t:`HRV baseline still building: ${hb.n} of ${st.hrvMinDays} readings in the last ${st.hrvWindow} days.`}); missing.push('HRV baseline'); }
  else { missing.push('HRV'); }

  // RHR
  const rb = rhrBaseline(D), rhr = num(ci?.rhr); let rhrDelta = null;
  if(rhr!=null && rb.ok){
    have.rhr = true; rhrDelta = rhr - rb.mean;
    const t = `Resting HR ${rhr} bpm, ${signed(rhrDelta)} vs your ${st.rhrWindow}-day average of ${fmt(rb.mean)}.`;
    if(rhrDelta >= st.rhrEasy) R.push({lv:'easy', key:'rhr', t}); else R.push({lv:'ok', t});
    pen += Math.min(20, Math.max(0,rhrDelta)*3);
  } else if(rhr!=null){ R.push({lv:'info', t:`Resting HR baseline needs 7 readings (have ${rb.n}).`}); missing.push('RHR baseline'); }
  else missing.push('resting HR');

  // combined HRV + RHR rest rule
  if(hrvLow && rhrDelta!=null && rhrDelta >= st.rhrRest){
    restF.push('hrv+rhr');
    R.forEach(x => { if(x.key==='hrv'||x.key==='rhr') x.lv='rest'; });
    R.push({lv:'rest', t:`HRV is low and resting HR is up ${fmt(rhrDelta)} bpm at the same time, a strong under-recovery signal.`});
  }

  // Sleep
  const sl = num(ci?.sleepH), ss = num(ci?.sleepScore);
  if(sl!=null){
    have.sleep = true;
    if(sl < st.sleepRest){ restF.push('sleep'); R.push({lv:'rest', t:`Only ${sl} h of sleep (under ${st.sleepRest} h).`}); }
    else if(sl < st.sleepEasy) R.push({lv:'easy', t:`${sl} h of sleep (under ${st.sleepEasy} h).`});
    else R.push({lv:'ok', t:`${sl} h of sleep.`});
    pen += Math.min(25, Math.max(0, 7.5-sl)*7);
  } else missing.push('sleep');
  if(ss!=null){
    if(ss < st.sleepScoreEasy) R.push({lv:'easy', t:`Sleep score ${ss} (under ${st.sleepScoreEasy}).`});
    pen += Math.min(10, Math.max(0,75-ss)*0.4);
  }

  // Subjective
  let poor = [];
  if(ci && ci.subjective){
    have.subj = true;
    const e = +ci.energy, so = +ci.soreness, sr = +ci.stress, m = +ci.motivation;
    if(e<=2) poor.push('low energy'); if(so>=4) poor.push('soreness'); if(sr>=4) poor.push('high stress'); if(m<=2) poor.push('low motivation');
    if(so >= st.sorenessEasy) R.push({lv:'easy', t:`Soreness ${so}/5.`});
    pen += Math.max(0,3-e)*5 + Math.max(0,so-2)*4 + Math.max(0,sr-3)*4 + Math.max(0,3-m)*3;
    if(ci.poorNutrition){ pen += 5; R.push({lv:'warn', t:'Poor nutrition yesterday: fuel well before and during today’s session.'}); }
  } else missing.push('check-in');
  if(ci?.sick){ restF.push('sick'); R.push({lv:'rest', t:'Sick or symptoms logged. No training while unwell.'}); }
  if(ci?.injury){ restF.push('injury'); R.push({lv:'rest', t:'Injury or pain logged. Rest the area until it settles.'}); }

  // Form
  const prev = SER.rows[addDays(D,-1)];
  const form = prev ? prev.form : null;
  const histDays = Math.round((parseDs(D)-parseDs(SER.firstData))/864e5);
  if(prev && histDays >= 14){
    have.load = true;
    const t = `Form ${signed(form)} (fitness ${fmt(prev.ctl)}, fatigue ${fmt(prev.atl)}).`;
    if(form <= st.formVeryNeg && poor.length >= st.poorSubjCount){ restF.push('form'); R.push({lv:'rest', t:`Form ${signed(form)} with ${poor.length} poor check-in scores (${poor.join(', ')}).`}); }
    else if(form <= st.formModNeg) R.push({lv:'easy', t:`${t} Fatigue is outpacing fitness.`});
    else R.push({lv:'ok', t});
    if(form<0) pen += Math.min(25, -form*0.8);
  } else missing.push('14+ days of training history');
  if(poor.length >= st.poorSubjCount && !restF.includes('form')) R.push({lv:'easy', t:`${poor.length} poor check-in scores: ${poor.join(', ')}.`});

  // Load spike
  const sp = loadSpike(D);
  if(sp.ok && sp.spike){ pen += 5; R.push({lv:'warn', t:`Last 7 days load ${fmt(sp.last7)} is ${fmt(sp.pct)}% above your 4-week weekly average (${fmt(sp.priorAvg)}).`}); }

  // Verdict
  R.forEach(x => { if(x.lv==='easy') easyF.push(x.t); });
  let verdict = restF.length ? 'REST' : easyF.length ? 'EASY' : 'HARD';
  let score = Math.round(clamp(100 - pen, 0, 100));
  if(ci?.sick) score = Math.min(score, 20);
  if(ci?.injury) score = Math.min(score, 30);
  score = verdict==='REST' ? Math.min(score, 39) : verdict==='EASY' ? clamp(score,40,69) : Math.max(score,70);

  const n = Object.values(have).filter(Boolean).length;
  const confidence = n>=4 ? 'Good' : n>=2 ? 'Lower' : 'Low';
  const order = {rest:0, easy:1, warn:2, ok:3, info:4};
  R.sort((a,b) => order[a.lv]-order[b.lv]);
  return {D, verdict, score, reasons:R, confidence, missing, form, prev, spike:sp, ci};
}

/* ---------- session suggestion ---------- */
function suggest(ev){
  const ci = ev.ci || {}, dow = parseDs(ev.D).getDay(), weekend = dow===0 || dow===6;
  const strengthDates = allWorkouts().filter(w=>w.type==='strength' && w.date<ev.D).map(w=>w.date).sort();
  const lastStr = strengthDates.pop();
  const sinceStr = lastStr ? Math.round((parseDs(ev.D)-parseDs(lastStr))/864e5) : 99;
  if(ev.verdict==='REST'){
    if(ci.sick) return {title:'Full rest', detail:'No training while you have symptoms. Hydrate, sleep, and check in again tomorrow.'};
    if(ci.injury) return {title:'Rest the sore area', detail:'Skip anything that loads it. A short pain-free walk is fine. See a professional if it lasts.', type:'walking', dur:20, rpe:2, name:'Easy walk'};
    return {title:'Rest day', detail:'Optional 20-minute easy walk and 10 minutes of mobility. Aim for an early night.', type:'walking', dur:20, rpe:2, name:'Recovery walk'};
  }
  if(ev.verdict==='EASY'){
    if((+ci.soreness||0) >= 4) return {title:'Pool recovery', detail:'30 minutes of easy laps or water walking. Moves the legs without loading sore muscles.', type:'pool', dur:30, rpe:3, name:'Pool workout (recovery)'};
    if(weekend) return {title:'Easy hike or paddle', detail:'60 minutes at a conversational effort. Flat trail or calm water.', type:'hiking', dur:60, rpe:3, name:'Easy hike'};
    return {title:'Easy spin', detail:'45 minutes in Zone 1–2, conversational pace, no intervals.', type:'cycling', dur:45, rpe:3, name:'Easy spin'};
  }
  if(sinceStr >= 3) return {title:'Full strength circuit', detail:'John A. Logan strength circuit: 3 rounds, controlled tempo, full effort on the main lifts.', type:'strength', dur:60, rpe:7, name:'John A. Logan strength circuit'};
  if(weekend) return {title:'Long ride', detail:'2–3 hours steady Zone 2 with a 20-minute tempo block in the second half. Fuel every 30–40 minutes.', type:'cycling', dur:150, rpe:6, name:'Long ride'};
  return {title:'Threshold intervals', detail:'15 min warm-up, 4 × 8 min at threshold with 4 min easy between, 10 min cool-down.', type:'cycling', dur:75, rpe:7, name:'Threshold intervals'};
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q = false; } else f += c; }
    else if(c==='"') q = true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f += c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()!==''));
}
function parseDuration(v){
  v = String(v||'').trim(); if(!v) return null;
  if(v.includes(':')){ const p = v.split(':').map(Number); if(p.some(isNaN)) return null; return p.length===3 ? p[0]*60+p[1]+p[2]/60 : p[0]+p[1]/60; }
  return num(v);
}
function parseDate(v){
  v = String(v||'').trim();
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m){ const y = m[3].length===2 ? '20'+m[3] : m[3]; return y+'-'+pad(+m[1])+'-'+pad(+m[2]); }
  return null;
}
function importCSV(text){
  const rows = parseCSV(text||'');
  if(rows.length<2){ setStatus('#csv-status', 'Add a header row and at least one activity.', 'err'); return; }
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = re => h.findIndex(x => re.test(x));
  const ix = {date:col(/date|day/), type:col(/type|sport|activity/), dur:col(/dur|minutes|mins|moving|time/), dist:col(/dist/), hr:col(/hr|heart/), tss:col(/tss|load/), rpe:col(/rpe/), name:col(/name|title/)};
  if(ix.date<0 || ix.dur<0){ setStatus('#csv-status', 'Missing a date or duration column. Check the header row.', 'err'); return; }
  let added = 0, skipped = 0, dup = 0; const ids = new Set(S.workouts.map(w=>w.id));
  rows.slice(1).forEach(r => {
    const date = parseDate(r[ix.date]), dur = parseDuration(r[ix.dur]);
    if(!date || dur==null){ skipped++; return; }
    const typeRaw = ix.type>=0 ? r[ix.type] : '';
    const type = mapType(typeRaw), id = 'csv-'+date+'-'+type+'-'+Math.round(dur);
    if(ids.has(id)){ dup++; return; } ids.add(id);
    S.workouts.push({id, date, type, name:(ix.name>=0 && r[ix.name]) ? r[ix.name].trim() : (typeRaw||TYPE_LABEL[type]),
      durationMin:Math.round(dur), distance: ix.dist>=0 ? num(r[ix.dist]) : null, avgHr: ix.hr>=0 ? num(r[ix.hr]) : null,
      tss: ix.tss>=0 ? num(r[ix.tss]) : null, rpe: ix.rpe>=0 ? num(r[ix.rpe]) : null, source:'csv'});
    added++;
  });
  save(); refreshData();
  setStatus('#csv-status', `Imported ${added} activit${added===1?'y':'ies'}.` + (dup?` ${dup} already existed.`:'') + (skipped?` Skipped ${skipped} row(s) with a bad date or duration.`:''), added ? 'ok' : (skipped ? 'err' : ''));
}

/* ---------- Intervals.icu ---------- */
async function icuImport(){
  S.icu.athleteId = $('#icu-id').value.trim(); S.icu.apiKey = $('#icu-key').value.trim(); save();
  const id = S.icu.athleteId, key = S.icu.apiKey;
  if(!id || !key){ setStatus('#icu-status', 'Enter your athlete ID and API key first.', 'err'); return; }
  const oldest = addDays(todayStr(), -60), newest = todayStr();
  const base = 'https://intervals.icu/api/v1/athlete/' + encodeURIComponent(id);
  const headers = {Authorization: 'Basic ' + btoa('API_KEY:' + key)};
  setStatus('#icu-status', 'Importing…');
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(() => ctrl && ctrl.abort(), 20000);
  try {
    const opts = {headers, signal: ctrl ? ctrl.signal : undefined};
    const [aRes, wRes] = await Promise.all([
      fetch(`${base}/activities?oldest=${oldest}&newest=${newest}`, opts),
      fetch(`${base}/wellness?oldest=${oldest}&newest=${newest}`, opts)
    ]);
    const bad = !aRes.ok ? aRes : !wRes.ok ? wRes : null;
    if(bad){ const e = new Error('HTTP'); e.status = bad.status; throw e; }
    const acts = await aRes.json(), well = await wRes.json();
    let na = 0, nw = 0; const toUnit = m => m ? Math.round(m / (S.settings.units==='mi' ? 1609.34 : 1000) * 10)/10 : null;
    (Array.isArray(acts)?acts:[]).forEach(a => {
      const date = String(a.start_date_local||a.start_date||'').slice(0,10); if(!date) return;
      const w = {id:'icu-'+a.id, date, type:mapType(a.type||a.name), name:a.name||a.type||'Activity',
        durationMin: Math.round((a.moving_time||a.elapsed_time||0)/60), distance: toUnit(a.distance),
        avgHr: a.average_heartrate ? Math.round(a.average_heartrate) : null, tss: num(a.icu_training_load), rpe: num(a.icu_rpe), source:'intervals'};
      const i = S.workouts.findIndex(x => x.id===w.id); if(i>=0) S.workouts[i] = w; else { S.workouts.push(w); na++; }
    });
    (Array.isArray(well)?well:[]).forEach(w => {
      const d = w.id; if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d))) return;
      let ci = S.checkins[d]; if(!ci || ci.sample) ci = {};
      let touched = false;
      if(num(w.hrv)!=null){ ci.hrv = Math.round(w.hrv); touched = true; }
      if(num(w.restingHR)!=null){ ci.rhr = Math.round(w.restingHR); touched = true; }
      if(num(w.sleepSecs)!=null){ ci.sleepH = Math.round(w.sleepSecs/900)/4; touched = true; }
      if(num(w.sleepScore)!=null){ ci.sleepScore = Math.round(w.sleepScore); touched = true; }
      if(touched){ S.checkins[d] = ci; nw++; }
    });
    save(); refreshData();
    setStatus('#icu-status', `Imported ${na} new activit${na===1?'y':'ies'} and wellness for ${nw} day${nw===1?'':'s'}.`, 'ok');
  } catch(e){
    let msg;
    if(e.status===401 || e.status===403) msg = 'Intervals.icu refused the key. Check the API key and athlete ID.';
    else if(e.status===404) msg = 'Athlete not found. Check the athlete ID (it starts with “i”).';
    else if(e.status) msg = `Intervals.icu returned an error (${e.status}). Try again later.`;
    else if(e.name==='AbortError') msg = 'Intervals.icu took too long to answer. Try again later.';
    else msg = 'Could not reach Intervals.icu. This preview blocks outside connections; the import works from the APK or a downloaded copy of the page. CSV import works everywhere.';
    setStatus('#icu-status', msg, 'err');
  } finally { clearTimeout(timer); }
}

/* ---------- sheets ---------- */
function openSheet(html, bind){
  $('#sheet-body').innerHTML = html; $('#sheet').hidden = false; document.body.style.overflow = 'hidden';
  $('#sheet-close').onclick = closeSheet; bind();
  setTimeout(() => $('#sheet-body').querySelector('input,select,textarea')?.focus({preventScroll:true}), 50);
}
function closeSheet(){ $('#sheet').hidden = true; document.body.style.overflow = ''; }
$('#sheet').addEventListener('click', e => { if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

function openCheckin(d){
  const ex = S.checkins[d] || {}, c = ex.sample ? {} : ex;
  const sv = (k, dflt) => (c[k]!=null ? c[k] : dflt);
  const slider = (k, l, dflt, lo, hi) => `<label class="slider"><span>${l}</span><input type="range" min="1" max="5" step="1" id="ci-${k}" value="${sv(k,dflt)}" aria-label="${l}, 1 ${lo} to 5 ${hi}"><output id="o-${k}">${sv(k,dflt)}</output></label>`;
  openSheet(`
    <div class="sheet-head"><h2>Check-in · ${niceDate(d)}</h2><button class="btn sm ghost" id="sheet-close">Close</button></div>
    <div class="grid2">
      <label class="field"><span>HRV (rMSSD, ms)</span><input type="number" inputmode="decimal" id="ci-hrv" value="${c.hrv??''}" placeholder="optional"></label>
      <label class="field"><span>Resting HR (bpm)</span><input type="number" inputmode="numeric" id="ci-rhr" value="${c.rhr??''}" placeholder="optional"></label>
      <label class="field"><span>Sleep (hours)</span><input type="number" inputmode="decimal" step="0.25" id="ci-sleepH" value="${c.sleepH??''}" placeholder="optional"></label>
      <label class="field"><span>Sleep score</span><input type="number" inputmode="numeric" id="ci-sleepScore" value="${c.sleepScore??''}" placeholder="optional"></label>
    </div>
    <div class="set-group">
      ${slider('energy','Energy',3,'drained','great')}
      ${slider('soreness','Soreness',2,'none','very sore')}
      ${slider('stress','Stress',2,'calm','very stressed')}
      ${slider('motivation','Motivation',3,'none','fired up')}
    </div>
    <div class="toggles">
      <label class="tg"><span>Sick or symptoms</span><input type="checkbox" id="ci-sick"${c.sick?' checked':''}></label>
      <label class="tg"><span>Injury or pain</span><input type="checkbox" id="ci-injury"${c.injury?' checked':''}></label>
      <label class="tg"><span>Poor nutrition yesterday</span><input type="checkbox" id="ci-poorNutrition"${c.poorNutrition?' checked':''}></label>
    </div>
    <label class="field"><span>Note</span><textarea id="ci-note" placeholder="Anything worth remembering">${esc(c.note||'')}</textarea></label>
    <button class="btn primary wide" id="ci-save">Save check-in</button>`, () => {
      ['energy','soreness','stress','motivation'].forEach(k => { const i = $('#ci-'+k); i.oninput = () => $('#o-'+k).textContent = i.value; });
      $('#ci-save').onclick = () => {
        const n = id => num($('#ci-'+id).value);
        S.checkins[d] = {hrv:n('hrv'), rhr:n('rhr'), sleepH:n('sleepH'), sleepScore:n('sleepScore'),
          energy:+$('#ci-energy').value, soreness:+$('#ci-soreness').value, stress:+$('#ci-stress').value, motivation:+$('#ci-motivation').value,
          sick:$('#ci-sick').checked, injury:$('#ci-injury').checked, poorNutrition:$('#ci-poorNutrition').checked,
          note:$('#ci-note').value.trim(), subjective:true};
        save(); closeSheet(); refreshData(); toast('Check-in saved');
      };
  });
}
function openWorkout(p){
  const u = S.settings.units;
  openSheet(`
    <div class="sheet-head"><h2>Log workout</h2><button class="btn sm ghost" id="sheet-close">Close</button></div>
    <div class="grid2">
      <label class="field"><span>Date</span><input type="date" id="w-date" value="${p.date||todayStr()}" max="${todayStr()}"></label>
      <label class="field"><span>Activity</span><select id="w-type">${TYPES.map(t=>`<option value="${t}"${t===(p.type||'cycling')?' selected':''}>${TYPE_LABEL[t]}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>Name</span><input type="text" id="w-name" value="${esc(p.name||'')}" placeholder="e.g. Tempo ride"></label>
    <div class="grid3">
      <label class="field"><span>Minutes</span><input type="number" inputmode="numeric" id="w-dur" value="${p.durationMin||''}"></label>
      <label class="field"><span>RPE (1–10)</span><input type="number" inputmode="numeric" min="1" max="10" id="w-rpe" value="${p.rpe||''}"></label>
      <label class="field"><span>TSS</span><input type="number" inputmode="numeric" id="w-tss" placeholder="optional"></label>
      <label class="field"><span>Distance (${u})</span><input type="number" inputmode="decimal" step="0.1" id="w-dist" placeholder="optional"></label>
      <label class="field"><span>Avg HR</span><input type="number" inputmode="numeric" id="w-hr" placeholder="optional"></label>
    </div>
    <p class="note">Load uses TSS when you enter it, otherwise minutes × RPE scaled to a TSS-like number.</p>
    <div class="status err" id="w-err" hidden></div>
    <button class="btn primary wide" id="w-save">Save workout</button>`, () => {
      $('#w-save').onclick = () => {
        const date = $('#w-date').value, dur = num($('#w-dur').value);
        if(!date || !dur){ setStatus('#w-err', 'Add a date and the number of minutes.', 'err'); return; }
        const type = $('#w-type').value;
        S.workouts.push({id:'m-'+uid(), date, type, name:$('#w-name').value.trim()||TYPE_LABEL[type], durationMin:Math.round(dur),
          rpe:num($('#w-rpe').value), tss:num($('#w-tss').value), distance:num($('#w-dist').value), avgHr:num($('#w-hr').value), source:'manual'});
        save(); closeSheet(); refreshData(); toast('Workout saved');
      };
  });
}

/* ---------- toast, routing ---------- */
let toastT = null;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
const VIEWS = ['today','trends','history','prefs'];
let current = 'today';
function show(v){
  if(!VIEWS.includes(v)) v = 'today'; current = v;
  VIEWS.forEach(x => { $('#v-'+x).hidden = x!==v; });
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab===v ? 'page' : 'false'));
  render(v); window.scrollTo(0,0);
}
function render(v){ ({today:renderToday, trends:renderTrends, history:renderHistory, prefs:renderPrefs})[v](); }
function refresh(){ plannerCache = null; buildSeries(); render(current); }
function refreshData(){ buildSeries(); if(current==='prefs') return; render(current); }
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  if(location.hash.slice(1)===b.dataset.tab) show(b.dataset.tab); else location.hash = b.dataset.tab;
}));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
mq && mq.addEventListener && mq.addEventListener('change', () => { if(current==='trends') renderTrends(); });
new MutationObserver(() => { if(current==='trends') renderTrends(); }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

$('#hdr-date').textContent = new Date().toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
buildSeries();
show(location.hash.slice(1) || 'today');
})();
</script>
